name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to its release
        required: true
      skip_version_check:
        description: Skip the tag-vs-versionName check (for old tags such as v1.4.0 / v1.5.0)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Tag must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master \
            || { echo "::error::$TAG is not on master. Only commits merged to master can be released."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match versionName
        if: ${{ github.event_name == 'push' || !inputs.skip_version_check }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "v$V" = "$TAG" ] || { echo "::error::Tag $TAG does not match versionName $V"; exit 1; }

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Test, lint, build signed APK and AAB
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --console=plain

      - name: Name the files
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk    out/PaymentSmsTracker-$TAG.apk
          cp app/build/outputs/bundle/release/*.aab out/PaymentSmsTracker-$TAG.aab
          cp app/build/outputs/mapping/release/mapping.txt out/mapping-$TAG.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
