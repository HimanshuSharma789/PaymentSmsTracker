name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Checks only. No keystore here, so the release bundle is unsigned and only proves the release
      # config builds. Signed releases are built by release.yml when a version tag is pushed.
      # lintRelease fails the build on release-blocking issues (lint "fatal" severity).
      - name: Unit tests, lint, debug APK and release bundle
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
