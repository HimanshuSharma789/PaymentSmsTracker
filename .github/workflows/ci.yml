name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Release AAB is unsigned here (no keystore.properties in CI); sign locally or upload-key sign in a
      # protected job. lintRelease fails the build on release-blocking issues (lint "fatal" severity).
      - name: Unit tests, lint, debug APK and release bundle
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
